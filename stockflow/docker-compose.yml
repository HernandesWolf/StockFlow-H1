# Sobe o banco e a API:  docker compose up --build
# Só o banco (para rodar a API pela IDE):  docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockflow}
    ports:
      - "5432:5432"
    volumes:
      - stockflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/stockflow
      DB_USER: stockflow
      DB_PASSWORD: ${DB_PASSWORD:-stockflow}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    ports:
      - "8080:8080"

volumes:
  stockflow-data:
