name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # "verify" roda os testes unitários (*Test, surefire) e depois os de integração
      # (*IT, failsafe). Os de integração usam Testcontainers, e o runner do GitHub já tem Docker.
      - name: Build e testes
        run: mvn -B verify

      - name: Publica relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Garante que a imagem Docker compila
        run: docker build -t stockflow:ci .
